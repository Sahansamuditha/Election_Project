version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: election_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: voting_app
    volumes:
      - election_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: election_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: voting_app
      DB_USER: root
      DB_PASS: rootpassword
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  election_db_data:
